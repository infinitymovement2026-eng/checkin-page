<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Daily Check-In</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4f1;
    --border-tertiary: rgba(0,0,0,0.12);
    --border-info: #185fa5;
    --text-primary: #1a1a1a;
    --text-secondary: #5f5e5a;
    --text-tertiary: #888780;
    --bg-success: #eaf3de;
    --text-success: #27500a;
    --bg-danger: #fcebeb;
    --text-danger: #791f1f;
    --bg-info: #e6f1fb;
    --text-info: #0c447c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-secondary);
    margin: 0; padding: 0;
    color: var(--text-primary);
  }
  .page { max-width: 520px; margin: 0 auto; padding: 2rem 1rem; }
  .card {
    background: var(--bg-primary);
    border: 1px solid var(--border-tertiary);
    border-radius: 12px;
    padding: 1.5rem;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 10px; border-radius: 8px; font-weight: 500;
  }
  .badge-ok  { background: var(--bg-success); color: var(--text-success); }
  .badge-err { background: var(--bg-danger);  color: var(--text-danger);  }
  .badge-info{ background: var(--bg-info);    color: var(--text-info);    }
  .field { margin-bottom: 1.25rem; }
  .field label {
    display: block; font-size: 13px; color: var(--text-secondary);
    margin-bottom: 6px; font-weight: 500;
  }
  .field input, .field select {
    width: 100%; padding: 8px 10px; font-size: 14px;
    border: 1px solid var(--border-tertiary); border-radius: 8px;
    background: var(--bg-primary); color: var(--text-primary);
  }
  .field input[readonly] { background: var(--bg-secondary); color: var(--text-secondary); }
  .location-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;
    padding: 10px 14px; background: var(--bg-secondary);
    border-radius: 8px; border: 1px solid var(--border-tertiary);
  }
  .location-label { font-size: 13px; color: var(--text-secondary); flex: 1; }
  .location-value { font-size: 13px; font-weight: 500; }
  .warning-box {
    border: 1px solid #e9b3b3; background: var(--bg-danger);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 1.25rem;
  }
  .warning-box p { margin: 0; font-size: 14px; color: var(--text-danger); line-height: 1.5; }
  .success-box {
    border: 1px solid #b7d79a; background: var(--bg-success);
    border-radius: 8px; padding: 20px 16px; text-align: center; display: none;
  }
  .success-box h3 { margin: 0 0 6px; color: var(--text-success); font-size: 16px; }
  .success-box p  { margin: 0; font-size: 13px; color: var(--text-success); }
  .submit-btn {
    width: 100%; padding: 11px; font-size: 15px; cursor: pointer;
    background: var(--bg-info); color: var(--text-info);
    border: 1px solid var(--border-info); border-radius: 8px; font-weight: 500;
    transition: opacity 0.2s;
  }
  .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .divider { border: none; border-top: 1px solid var(--border-tertiary); margin: 1.25rem 0; }
  #detection-note { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; margin-bottom: 0; }
  .location-btn {
    padding: 6px 12px; font-size: 12px; background: var(--bg-info);
    color: var(--text-info); border: 1px solid var(--border-info);
    border-radius: 6px; cursor: pointer; font-weight: 500;
  }
  .location-btn:hover { opacity: 0.8; }
</style>
</head>
<body>

<div class="page">
  <div class="card">

    <!-- Header -->
    <div style="margin-bottom:1.25rem;">
      <p style="margin:0; font-weight:600; font-size:16px;">Team Daily Check-In</p>
      <p style="margin:4px 0 0; font-size:13px; color:var(--text-secondary);">Infinity Support — submit your daily update</p>
    </div>

    <!-- Location status -->
    <div class="location-row">
      <span class="location-label">Location</span>
      <span class="location-value" id="location-display">Detecting…</span>
      <span class="badge badge-info" id="location-badge" style="display:none;"></span>
    </div>
    <div style="text-align: right; margin-bottom: 0.75rem;">
      <button class="location-btn" onclick="detectLocation()">🔄 Refresh</button>
    </div>
    <p id="detection-note"></p>

    <!-- Access blocked warning -->
    <div id="warning-area" style="display:none;" class="warning-box">
      <p><strong>Access restricted.</strong> This check-in can only be submitted from the
      <strong>Infinity Support office location</strong>. Please ensure you are within the office area and try again.</p>
    </div>

    <hr class="divider" />

    <!-- Form -->
    <div id="form-area">
      <div class="field">
        <label>Full Name *</label>
        <select id="name-field" required onchange="syncEmail()">
          <option value="">— Choose your name —</option>
          <option data-email="pravintamang534@gmail.com">Prabin Tamang</option>
          <option data-email="shahaditya9898@gmail.com">Aditya Bdr Shah</option>
          <option data-email="sunilthaparai0987@gmail.com">Sunil Thapa</option>
          <option data-email="kreeshsunwar@gmail.com">Krish Sunar</option>
          <option data-email="shresthapragya89@gmail.com">Pragya Shrestha</option>
          <option data-email="nainaaashahi@gmail.com">Aayushi Shahi</option>
          <option data-email="kushalregmi998877@gmail.com">Kushal Regmi</option>
          <option data-email="shusilkhatri22@gmail.com">Sushil Khatri</option>
          <option data-email="amanshahi1098@gmail.com">Aman Kishor Shahi</option>
          <option data-email="karnsony07@gmail.com">Ragani Karna</option>
        </select>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="text" id="email-display" readonly placeholder="Auto-filled after selecting name" />
      </div>
      <button class="submit-btn" id="submit-btn" disabled onclick="submitForm()">
        Submit check-in
      </button>
      <p id="submit-note" style="font-size:12px; color:var(--text-tertiary); margin-top:8px; text-align:center;"></p>
    </div>

    <!-- Success -->
    <div id="success-area" class="success-box">
      <h3>✓ Check-in recorded!</h3>
      <p id="success-detail"></p>
    </div>

  </div>
</div>

<script>
  // ====== CONFIG ======
  const ALLOWED_LOCATIONS = [
    {
      name: "Infinity Support - Kathmandu",
      lat: 27.727004,      // Your office latitude
      lng: 85.333481,      // Your office longitude
      radiusMeters: 150  // 150m radius
    }
    // Add more locations if needed:
    // {
    //   name: "Infinity Support - Branch",
    //   lat: 27.7050,
    //   lng: 85.3300,
    //   radiusMeters: 150
    // }
  ];
  
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwH2PlUuu1YM9T2w2l2jO8hib-ycDaZy389rhIEiQju67sDFcVDDQYpIum71gLe3kjYNQ/exec";
  // =====================

  let userLat        = null;
  let userLng        = null;
  let userAccuracy   = null;
  let matchedLocation = null;
  let accessAllowed  = false;

  function syncEmail() {
    const sel   = document.getElementById("name-field");
    const opt   = sel.options[sel.selectedIndex];
    const email = opt.getAttribute("data-email") || "";
    document.getElementById("email-display").value = email;
  }

  // Haversine formula: calculates distance between two coordinates in meters
  function calculateDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000; // Earth's radius in meters
    const φ1 = (lat1 * Math.PI) / 180;
    const φ2 = (lat2 * Math.PI) / 180;
    const Δφ = ((lat2 - lat1) * Math.PI) / 180;
    const Δλ = ((lng2 - lng1) * Math.PI) / 180;

    const a =
      Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
      Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c; // Distance in meters
  }

  async function detectLocation() {
    const locationDisplay = document.getElementById("location-display");
    const badge = document.getElementById("location-badge");
    const warning = document.getElementById("warning-area");
    const submitBtn = document.getElementById("submit-btn");
    const note = document.getElementById("detection-note");

    locationDisplay.textContent = "Getting location…";
    badge.style.display = "none";
    warning.style.display = "none";
    submitBtn.disabled = true;
    note.textContent = "";

    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        locationDisplay.textContent = "Location unavailable";
        note.textContent = "Your browser doesn't support geolocation.";
        submitBtn.disabled = true;
        accessAllowed = false;
        resolve(false);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;
          userAccuracy = position.coords.accuracy;

          // Check if user is within allowed location
          let authorized = false;
          matchedLocation = null;
          let closestDistance = Infinity;

          for (let loc of ALLOWED_LOCATIONS) {
            const distance = calculateDistance(userLat, userLng, loc.lat, loc.lng);
            
            if (distance < closestDistance) {
              closestDistance = distance;
            }
            
            if (distance <= loc.radiusMeters) {
              authorized = true;
              matchedLocation = loc.name;
              break;
            }
          }

          if (authorized) {
            locationDisplay.textContent = matchedLocation;
            badge.textContent = "✓ Authorized";
            badge.className = "badge badge-ok";
            badge.style.display = "inline-flex";
            warning.style.display = "none";
            submitBtn.disabled = false;
            accessAllowed = true;
            note.textContent = `📍 ${userLat.toFixed(4)}°, ${userLng.toFixed(4)}° (Accuracy: ±${userAccuracy.toFixed(0)}m)`;
          } else {
            locationDisplay.textContent = "Outside office area";
            badge.textContent = "Not authorized";
            badge.className = "badge badge-err";
            badge.style.display = "inline-flex";
            warning.style.display = "block";
            submitBtn.disabled = true;
            accessAllowed = false;
            note.textContent = `📍 ${userLat.toFixed(4)}°, ${userLng.toFixed(4)}° — ${closestDistance.toFixed(0)}m away (Accuracy: ±${userAccuracy.toFixed(0)}m)`;
          }
          resolve(authorized);
        },
        (error) => {
          let errorMsg = "Location permission denied.";
          if (error.code === error.PERMISSION_DENIED) {
            errorMsg = "Please enable location permissions in your browser settings.";
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            errorMsg = "Location information is unavailable.";
          } else if (error.code === error.TIMEOUT) {
            errorMsg = "Location request timed out.";
          }

          locationDisplay.textContent = "Location denied";
          note.textContent = errorMsg;
          badge.textContent = "⚠ Permission required";
          badge.className = "badge badge-info";
          badge.style.display = "inline-flex";
          warning.style.display = "block";
          submitBtn.disabled = true;
          accessAllowed = false;
          resolve(false);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    });
  }

  async function submitForm() {
    if (!accessAllowed) return;

    const name  = document.getElementById("name-field").value;
    const email = document.getElementById("email-display").value;

    if (!name || !email) {
      alert("Please select your name.");
      return;
    }

    const btn  = document.getElementById("submit-btn");
    const note = document.getElementById("submit-note");
    btn.disabled = true;
    note.textContent = "Submitting…";

    const payload = {
      name: name,
      email: email,
      location: matchedLocation,
      latitude: userLat,
      longitude: userLng,
      accuracy: userAccuracy,
      timestamp: new Date().toISOString()
    };

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      // no-cors means we can't read the response, but if no error was thrown it went through
      document.getElementById("form-area").style.display = "none";
      document.getElementById("success-area").style.display = "block";
      document.getElementById("success-detail").textContent =
        name + " (" + email + ") — logged at " + new Date().toLocaleTimeString("en-NP", { timeZone: "Asia/Kathmandu" });

    } catch (err) {
      btn.disabled = false;
      note.textContent = "Submission failed. Please try again.";
    }
  }

  // Auto-detect location on page load
  detectLocation();
</script>
</body>
</html>
